<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161b">
<meta name="description" content="Unofficial fan-made deck manager. Not affiliated with the game publisher.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heat Deck">
<title>Heat Companion (fan-made)</title>
<style>
:root{--bg:#14161b;--panel:#1d2027;--panel2:#272b34;--txt:#f2f2f2;--mut:#9aa0ab;--acc:#ff5a1f;--pc:#888}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left)}
#app{max-width:600px;margin:0 auto;padding:0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
header{display:flex;align-items:center;gap:6px;padding:12px 0 8px}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:.02em;min-width:0}
header h1 span{color:var(--acc)}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel2);font-size:18px;flex:0 0 auto}
.wrap{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top) + 6px);display:flex;flex-direction:column;gap:8px;align-items:center;max-height:calc(100vh - 16px);overflow-y:auto;padding:4px 0 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rb{position:relative;width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.18);font-size:13px;font-weight:800;padding:0;opacity:.72}
.rb.on{border-color:#fff;opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}
.rb i{position:absolute;font-style:normal;font-size:10px;font-weight:800;line-height:15px;min-width:15px;height:15px;border-radius:8px;padding:0 3px;color:#fff}
.rb .rg{left:-5px;bottom:-5px;background:#000c}
.rb .rh{right:-5px;bottom:-5px;background:#c2410c}
.rb .rp{right:-3px;top:-3px;min-width:11px;width:11px;height:11px;padding:0;background:#4ade80;border:2px solid var(--bg)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:0 0 auto;display:inline-block}
.panel{background:var(--panel);border-radius:16px;padding:12px;margin-bottom:10px}
.panel.me{border-top:5px solid var(--pc)}
.panel h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.pname{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel2);border-radius:12px;padding:8px 2px;text-align:center}
.stat b{display:block;font-size:21px}
.stat span{font-size:10px;color:var(--mut)}
.stat.heat b{color:#ff7a3d}
.mut{color:var(--mut);font-size:13px}
.gears{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.gear{height:52px;border-radius:14px;border:2px solid var(--panel2);background:var(--panel2);font-size:24px;font-weight:800}
.gear.on{background:var(--pc);border-color:#fff;color:var(--ink,#fff)}
.hand{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;min-height:96px}
.card{width:54px;height:78px;border-radius:9px;border:2px solid rgba(255,255,255,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;color:#fff;padding:0;font-family:inherit;position:relative;transition:transform .1s;flex:0 0 auto;overflow:hidden}
.card .v{font-size:26px;line-height:1}
.card .i{font-size:8px;letter-spacing:.06em;opacity:.9;text-transform:uppercase}
.card.b{background:linear-gradient(160deg,#3b82f6,#1e3a8a)}
.card.s{background:repeating-linear-gradient(45deg,#6d3fc0 0 8px,#4b2a8a 8px 16px)}
.card.h{background:linear-gradient(160deg,#ff7a3d,#b3200f)}
.card.u{background:linear-gradient(160deg,#f6c94a,#a8740c);color:#2a1d00}
.card.g{background:#ece5d3;color:#17181c;justify-content:flex-start;gap:2px;border-color:#17181c}
.card.g .ub{width:100%;background:#17181c;color:#fff;font-size:19px;line-height:26px;height:26px;text-align:center;letter-spacing:-.02em}
.card.g .ub.sm{font-size:12px}
.card.g .i{font-size:8px;opacity:1;font-weight:800;margin-top:1px}
.card.g .sys{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;padding:0 1px}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px #fff,0 8px 16px #0009}
.card.dis{opacity:.5}
.card.void{opacity:.45;filter:grayscale(1)}
.sy{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:5px;font-size:9px;font-weight:800;padding:0 2px;line-height:1;color:#fff;flex:0 0 auto;font-family:-apple-system,system-ui,sans-serif}
.sy.lg{min-width:26px;height:24px;font-size:12px;border-radius:7px;padding:0 4px}
.sy-h{background:#d92d20}.sy-d{background:#6b7280}.sy-l{background:#fff;color:#111;border-radius:50%;box-shadow:inset 0 0 0 2px #9aa0ab}
.sy.lg.sy-l{border-radius:12px}
.sy-c{background:#1d9bf0}.sy-s{background:#12805c}
.sy-r{background:repeating-linear-gradient(45deg,#e5b93c 0 4px,#4b3aa8 4px 8px);text-shadow:0 0 2px #000,0 0 2px #000}
.sy-g{background:#cfd4dc;color:#111}.sy-dp{background:#fff;color:#111;box-shadow:inset 0 0 0 1px #9aa0ab}.sy-acc{background:#111;box-shadow:inset 0 0 0 1px #fff}
.sy-rf{background:conic-gradient(#111 25%,#eee 0 50%,#111 0 75%,#eee 0);background-size:8px 8px;text-shadow:0 0 2px #000,0 0 3px #000}
.sy.m{box-shadow:0 2px 0 #f5b301}
.sy-l.m{box-shadow:inset 0 0 0 2px #9aa0ab,0 2px 0 #f5b301}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.row.wrap{flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--acc);color:#fff;font-weight:700}
.btn.sec{background:var(--panel2)}
.btn.sec.on{background:#3b82f6}
.btn.big{width:100%;padding:15px;font-size:17px}
.btn.ghost{background:transparent;border:1px solid var(--panel2)}
.btn.sm{padding:8px 12px;font-size:14px}
.play{display:flex;flex-wrap:wrap;gap:10px;min-height:80px;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px}
.slot .arr{font-size:11px;color:var(--mut);line-height:1}
.slot .pl{width:54px;height:30px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800}
.chs{display:flex;gap:3px;margin-top:2px}
.chs button{min-width:24px;height:26px;border-radius:7px;border:0;background:var(--panel2);font-weight:800;font-size:14px;padding:0 4px}
.chs button.on{background:#fff;color:#111}
.fx{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fxb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--panel2);background:transparent;border-radius:10px;padding:6px 8px;font-size:13px;color:var(--txt)}
button.fxb{background:var(--panel2);border-color:#3a3f4a}
.fxb.mand{border-color:#f5b301}
.fxb.done{opacity:.55}
.fxb .st{margin-left:auto;font-weight:800;font-size:12px;color:var(--mut);white-space:nowrap}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sum span{background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.speedbox{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.speedbox span{color:var(--mut);text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.speedbox b{font-size:46px;line-height:1;color:var(--pc);text-shadow:0 0 1px #fff}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border:0;border-radius:10px;background:var(--panel2);font-size:20px}
.step b{min-width:26px;text-align:center;font-size:18px}
input{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid #3a3f4a;border-radius:10px;padding:10px;width:100%;min-width:0}
.lbl{flex:1;font-size:14px;min-width:0}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.x{width:38px;height:38px;border-radius:10px;border:0;background:var(--panel2);flex:0 0 auto}
.ubtn{height:38px;border-radius:10px;border:0;background:var(--panel2);padding:0 10px;font-weight:700;font-size:14px;flex:0 0 auto;white-space:nowrap}
.ubtn.warn{box-shadow:inset 0 0 0 2px #f5b301}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25)}
.sw.on{border-color:#fff;transform:scale(1.12)}
.log{font-size:13px;color:var(--mut);max-height:160px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px solid var(--panel2)}
.leg{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:8px}
.leg b{display:block}
.leg span.tx{color:var(--mut)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.sheethead{display:flex;align-items:center;gap:8px;padding:12px}
.sheethead h3{margin:0;flex:1;font-size:18px;min-width:0}
.sheetbody{flex:1;overflow-y:auto;padding:0 12px 24px;-webkit-overflow-scrolling:touch;max-width:600px;width:100%;margin:0 auto}
.filt{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filt button{border:0;border-radius:999px;background:var(--panel2);padding:7px 12px;font-size:13px;font-weight:700}
.filt button.on{background:#fff;color:#111}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 0 6px}
.urow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:12px;background:var(--panel);margin-bottom:6px;border:2px solid transparent;color:var(--txt)}
.urow.on{border-color:var(--acc)}
.urow .ut{flex:1;min-width:0;font-size:13px}
.urow .ut b{display:block;font-size:14px}
.urow .ut .bd{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.urow .ck{width:26px;height:26px;border-radius:50%;border:2px solid #3a3f4a;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.urow.on .ck{background:var(--acc);border-color:var(--acc)}
.note{background:var(--panel);border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px}
.note.warn{box-shadow:inset 0 0 0 2px #f5b301}
.chips{display:flex;gap:8px;margin-top:8px}
.chips button{flex:1;border:2px solid #3a3f4a;border-radius:10px;background:var(--panel2);padding:10px 4px;font-weight:800}
.chips button.on{border-color:#f5b301;background:#5a3f00}
.disc{margin:18px 4px 4px;font-size:11px;line-height:1.4;color:var(--mut);text-align:center;opacity:.8}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,30px);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center;z-index:70;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
#modal.on{display:flex}
.mbox{background:var(--panel);border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:86vh;overflow:auto}
.mbox h3{margin:0 0 6px}.mbox p{margin:0 0 12px;color:var(--mut)}
.mrow{display:flex;gap:8px;margin-top:12px}.mrow .btn{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:8px}
</style>
</head>

/* ---------- PWA bootstrap (icons + manifest generated at runtime so it stays a single file) ---------- */
(function(){
  try{
    const cv=document.createElement('canvas');
    const icon=sz=>{
      cv.width=cv.height=sz;const x=cv.getContext('2d');
      const g=x.createLinearGradient(0,0,sz,sz);g.addColorStop(0,'#ff7a3d');g.addColorStop(1,'#a81d0e');
      x.fillStyle=g;x.fillRect(0,0,sz,sz);
      const n=8,s=sz/n;
      for(let i=0;i<n;i++){x.fillStyle=i%2?'#fff':'#111';x.fillRect(i*s,0,s,s/2);x.fillStyle=i%2?'#111':'#fff';x.fillRect(i*s,s/2,s,s/2);}
      x.textAlign='center';x.textBaseline='middle';
      x.font=(sz*.36)+'px sans-serif';x.fillText('🔥',sz/2,sz*.42);
      x.fillStyle='#fff';x.font='900 '+(sz*.24)+'px -apple-system,Helvetica,Arial,sans-serif';
      x.shadowColor='#000';x.shadowBlur=sz*.02;x.fillText('HEAT',sz/2,sz*.74);
      return cv.toDataURL('image/png');
    };
    const i180=icon(180),i192=icon(192),i512=icon(512);
    const add=(rel,href,extra)=>{const l=document.createElement('link');l.rel=rel;l.href=href;if(extra)Object.keys(extra).forEach(k=>l.setAttribute(k,extra[k]));document.head.appendChild(l)};
    add('apple-touch-icon',i180,{sizes:'180x180'});
    add('icon',i192,{type:'image/png'});
    const mf={name:'Heat Companion (unofficial fan-made)',short_name:'Heat Deck',start_url:location.href.split('#')[0],scope:location.href.split('#')[0].replace(/[^\/]*$/,''),display:'standalone',orientation:'portrait',background_color:'#14161b',theme_color:'#14161b',icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
    add('manifest',URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'})));
  }catch(e){}
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();

function normalize(){
  S.opts=Object.assign(DEF().opts,S.opts||{});
  if(!Array.isArray(S.pool))S.pool=[];
  S.players.forEach(p=>{
    if(!Array.isArray(p.upg))p.upg=[];
    if(!Array.isArray(p.rm))p.rm=[];
    if(p.gas==null)p.gas=false;
    (p.play||[]).forEach(s=>{if(!s.repls){s.repls=s.repl?[s.repl]:[];delete s.repl}if(!s.done)s.done={};if(s.ch==null)s.ch=0;if(s.plusN==null)s.plusN=s.repls.length});
  });
}

const mk=(ty,v=0,n=0)=>{const c={id:S.nextId++,t:ty,v};if(n)c.n=n;return c};   // t: b=Base, s=Stress, h=Heat, u=Upgrade (n = catalogue number)
const L=(p,m)=>{p.log.unshift(m);if(p.log.length>40)p.log.length=40};
const gearCool=g=>g===1?3:g===2?1:0;
const cdef=c=>c&&c.t==='u'&&c.n?U[c.n]:null;
const udef=s=>s.void?null:cdef(s.card);
const cname=c=>{const d=cdef(c);return d?t('c_'+d.k):''};
function slotVal(s){
  let v=0;const c=s.card;
  if(c&&!s.void){const d=cdef(c);if(d)v+=d.v?d.v[Math.min(s.ch||0,d.v.length-1)]:0;else if(c.t==='b'||c.t==='u')v+=c.v}
  return v+(s.repls||[]).reduce((a,r)=>a+r.v,0);
}
function fx(p){
  const o={cool:0,slip:0,lim:0,plus:0,acc:0};
  p.play.forEach(s=>{o.plus+=s.plusN||0;const d=udef(s);if(!d)return;o.cool+=d.c||0;o.slip+=d.s||0;o.lim+=d.l||0;if(d.acc&&s.done.acc)o.acc++});
  return o;
}
function speed(p){const f=fx(p);return p.play.reduce((a,s)=>a+slotVal(s),0)+(p.adrS?1:0)+(p.adj||0)+f.plus*f.acc}
const coolAllow=p=>gearCool(p.gear)+(p.adrC?1:0)+fx(p).cool;
const needRm=p=>S.opts.start?Math.max(0,Math.min(3,p.upg.length-2)):0;
function fixRm(p){const n=needRm(p);if(n===3)p.rm=['h','5','0'];else if(p.rm.length>n)p.rm=p.rm.slice(0,n)}
const owner=n=>S.players.find(p=>p.upg.includes(n));

/* ---------- deck engine ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// draw one card from top of deck; if deck is empty, shuffle discard pile into a new deck immediately
function drawOne(p){
  if(!p.deck.length){
    if(!p.discard.length)return null;
    p.deck=shuffle(p.discard);p.discard=[];
    pending.push(t('reshuf',p.name));
  }
  return p.deck.pop();
}
function drawTo(p){while(p.hand.length<S.opts.hand){const c=drawOne(p);if(!c)break;p.hand.push(c)}}
// Stress / ✚ symbol rule: reveal until a Base card appears, non-base cards go to discard
function revealBase(p){
  if(![...p.deck,...p.discard].some(c=>c.t==='b'))return null;
  for(let g=0;g<1000;g++){
    const c=drawOne(p);if(!c)return null;
    if(c.t==='b')return c;
    p.discard.push(c);
  }
  return null;
}
function addPlusTo(p,s,n){for(let i=0;i<n;i++){const b=revealBase(p);if(b){s.repls.push(b);s.plusN++}else pending.push(t('nobase'))}}
function newSlot(card,label){return{card:card||null,label:label||'',repls:[],ch:0,done:{},plusN:0}}
// put a card from hand into the play area, resolving ✚ symbols and the Heat cost
function makeSlot(p,c){
  const s=newSlot(c);
  if(c.t==='s')addPlusTo(p,s,1);
  const d=cdef(c);
  if(d){
    if(d.h){
      if(p.engine>=d.h)payHeat(p,d.h);
      else{ // cannot pay: discard the card and replace it with a Base card (not a ✚ symbol)
        s.void=true;p.discard.push(c);
        const b=revealBase(p);if(b)s.repls.push(b);else pending.push(t('nobase'));
        pending.push(t('voidmsg',t('c_'+d.k)));return s;
      }
    }
    addPlusTo(p,s,d.p||0);
  }
  return s;
}
function payHeat(p,n){p.engine-=n;for(let i=0;i<n;i++)p.discard.push(mk('h'));L(p,t('lPay',n))}
function scrap(p,n){for(let i=0;i<n;i++){const c=drawOne(p);if(c)p.discard.push(c)}L(p,t('lScrap',n))}
function newPlayer(color,name){return{id:S.nextId++,color,name,deck:[],hand:[],discard:[],play:[],engine:0,gear:1,played:false,adrS:false,adrC:false,adj:0,accel:false,gas:false,coolUsed:0,log:[],upg:[],rm:[]}}
function buildDeck(p){
  const o=S.opts;p.deck=[];p.hand=[];p.discard=[];p.play=[];
  for(let v=1;v<=4;v++)for(let i=0;i<3;i++)p.deck.push(mk('b',v));
  for(let i=0;i<o.stress;i++)p.deck.push(mk('s'));
  if(o.start){
    fixRm(p);
    if(!p.rm.includes('0'))p.deck.push(mk('u',0));
    if(!p.rm.includes('5'))p.deck.push(mk('u',5));
    if(!p.rm.includes('h'))p.deck.push(mk('h'));
  }
  p.upg.forEach(n=>p.deck.push(U[n].k==='heat'?mk('h'):mk('u',0,n)));
  p.engine=o.heat;p.gear=1;resetTurnFlags(p);p.log=[];
  shuffle(p.deck);drawTo(p);
}
function resetTurnFlags(p){p.played=false;p.adrS=p.adrC=p.accel=p.gas=false;p.adj=0;p.coolUsed=0}

/* ---------- UI helpers ---------- */
let toastT;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}
function modal({title,msg='',input=null,ok=t('ok'),cancel=true}){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="mbox"><h3>${esc(title)}</h3><p>${esc(msg)}</p>${input!==null?`<input id="minp" type="number" inputmode="numeric" value="${input}">`:''}<div class="mrow">${cancel?`<button class="btn ghost" id="mc">${t('cancel')}</button>`:''}<button class="btn" id="mo">${esc(ok)}</button></div></div>`;
    m.classList.add('on');
    const close=v=>{m.classList.remove('on');m.innerHTML='';res(v)};
    $('#mo').onclick=()=>close(input!==null?parseInt($('#minp').value,10):true);
    if(cancel)$('#mc').onclick=()=>close(input!==null?null:false);
  });
}
// pick up to `max` cards from a list; resolves with the chosen ids (or null)
function pickCards(title,msg,cards,max){
  return new Promise(res=>{
    const m=$('#modal'),sel=new Set();
    m.innerHTML=`<div class="mbox"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="pick">${cards.map(c=>cardHTML(c,{pick:1})).join('')}</div><div class="mrow"><button class="btn ghost" id="mc">${t('cancel')}</button><button class="btn" id="mo">${t('ok')} (0/${max})</button></div></div>`;
    m.classList.add('on');
    m.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      const id=+b.dataset.pick;
      if(sel.has(id)){sel.delete(id);b.classList.remove('sel')}else if(sel.size<max){sel.add(id);b.classList.add('sel')}
      $('#mo').textContent=`${t('ok')} (${sel.size}/${max})`;
    });
    const close=v=>{m.classList.remove('on');m.innerHTML='';res(v)};
    $('#mo').onclick=()=>close([...sel]);
    $('#mc').onclick=()=>close(null);
  });
}

  hist.push(JSON.stringify(S));if(hist.length>40)hist.shift();

function cardHTML(c,o={}){
  const tag=o.act||o.pick?'button':'div';
  const d=cdef(c);
  let inner='',cls=c.t;
  if(d){inner=upgInner(d);cls='g'}
  else if(c.t==='b')inner=`<span class="v">${c.v}</span><span class="i">Base</span>`;
  else if(c.t==='s')inner=`<span class="v">✚</span><span class="i">Stress</span>`;

/* ---------- actions ---------- */
async function setGear(p,g){
  if(p.played||g===p.gear)return;
  const d=Math.abs(g-p.gear);
  if(d>2){toast(t('gear2max'));return}
  if(d===2){
    if(p.engine<1){toast(t('noheat'));return}
    if(!await modal({title:t('shift2'),msg:t('shift2msg'),ok:t('pay1')}))return;
    act(()=>{const old=p.gear;p.engine--;p.discard.push(mk('h'));p.gear=g;L(p,t('lShift',old,g))});
    return;
  }
  act(()=>{p.gear=g});
}
function doPlay(p){
  const cards=[...ui.sel].map(id=>p.hand.find(c=>c.id===id)).filter(Boolean);
  if(cards.length!==p.gear){toast(t('selN',p.gear));return}
  act(()=>{
    const ids=new Set(cards.map(c=>c.id));
    p.hand=p.hand.filter(c=>!ids.has(c.id));
    L(p,t('lPlay',p.gear));
    p.play=cards.map(c=>makeSlot(p,c));
    p.played=true;p.coolUsed=0;ui.sel.clear();
  });
}
function doDirect(p){
  const c=p.hand.find(x=>ui.sel.has(x.id));if(!c||!cdef(c)||!cdef(c).dp)return;
  act(()=>{p.hand=p.hand.filter(x=>x.id!==c.id);L(p,t('lDirect'));p.play.push(makeSlot(p,c));ui.sel.clear()});
}
async function doFx(p,i,k){
  const s=p.play[i],d=s&&udef(s);if(!d||!d[k])return;
  if(k==='rf'||k==='acc'){act(()=>{s.done[k]=!s.done[k]});return}
  if(s.done[k])return;
  if(k==='d'){act(()=>{scrap(p,d.d);s.done.d=true});return}
  if(k==='r'){
    const n=Math.min(d.r,p.hand.filter(c=>c.t==='s').length);
    if(!n){toast(t('noStress'));return}
    act(()=>{let q=n;p.hand=p.hand.filter(c=>{if(q>0&&c.t==='s'){q--;p.discard.push(c);return false}return true});s.done.r=true;L(p,t('lStress',n))});return;
  }
  if(k==='g'){
    if(!p.discard.length){toast(t('salvEmpty'));return}
    const ids=await pickCards(t('salvT'),t('salvM',d.g),p.discard,d.g);
    if(!ids||!ids.length)return;
    act(()=>{const set=new Set(ids),out=p.discard.filter(c=>set.has(c.id));p.discard=p.discard.filter(c=>!set.has(c.id));p.deck.push(...out);shuffle(p.deck);s.done.g=true;L(p,t('lSalv',out.length))});
  }
}
async function doJam(p){
  if(!await modal({title:t('jamTitle'),msg:t('jamMsg'),ok:t('ok')}))return;
  act(()=>{
    const playable=p.hand.filter(c=>c.t!=='h');
    const need=Math.max(0,p.gear-playable.length);
    const heats=p.hand.filter(c=>c.t==='h').slice(0,need);
    const ids=new Set([...playable,...heats].map(c=>c.id));
    p.hand=p.hand.filter(c=>!ids.has(c.id));
    p.discard.push(...playable,...heats);
    p.gear=1;L(p,t('lJam'));drawTo(p);ui.sel.clear();
  });
}
function doEnd(p){
  act(()=>{
    const sp=speed(p);
    // mandatory Scrap symbols that were not applied yet
    p.play.forEach(s=>{const d=udef(s);if(d&&d.d&&!s.done.d){scrap(p,d.d);s.done.d=true;pending.push(t('scrapAuto'))}});
    const back=[];
    p.play.forEach(s=>{
      if(s.card&&!s.void){if(s.done.rf&&udef(s)&&udef(s).rf)back.push(s.card);else p.discard.push(s.card)}
      s.repls.forEach(r=>p.discard.push(r));
    });
    back.forEach(c=>p.deck.push(c)); // Refresh: back on top of the draw deck
    p.play=[];resetTurnFlags(p);ui.sel.clear();ui.limit='';
    drawTo(p);L(p,t('lEnd',sp));
  });
}
async function doCurve(p){
  const raw=parseInt(ui.limit,10);
  if(isNaN(raw)){toast(t('enterlimit'));return}
  const lim=raw+fx(p).lim,sp=speed(p),ex=sp-lim;
  if(ex<=0){toast(t('curveok',sp,lim));return}
  if(p.engine>=ex){
    if(await modal({title:t('overspeed'),msg:t('overmsg',sp,lim,ex),ok:t('payN',ex)}))act(()=>payHeat(p,ex));
  }else if(await modal({title:t('spin'),msg:t('spinmsg',sp,lim,ex,p.engine),ok:t('spin')})){
    act(()=>{
      if(p.engine>0)payHeat(p,p.engine);
      const n=p.gear<=2?1:2;
      for(let i=0;i<n;i++)p.hand.push(mk('s'));
      p.gear=1;L(p,t('lSpin',n));
    });
  }
}
function startRace(){
  if(!S.players.length){toast(t('needPlayer'));return}
  S.players.forEach(fixRm);
  const bad=S.players.find(p=>p.rm.length<needRm(p));
  if(bad){ui.sheet={mode:'pilot',id:bad.id};render();toast(t('rmNeed',bad.name));return}
  act(()=>{S.players.forEach(buildDeck);S.started=true;S.active=0;ui.screen='game';ui.sel.clear();ui.sheet=null});
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const d=el.dataset,p=S.players[S.active];
  switch(d.a){
    case 'tab':S.active=+d.i;ui.sel.clear();ui.limit='';save();render();break;
    case 'gear':setGear(p,+d.g);break;
    case 'sel':{
      const c=p.hand.find(x=>x.id===+d.id);if(!c||!selectable(p,c))break;
      ui.sel.has(c.id)?ui.sel.delete(c.id):ui.sel.add(c.id);render();break;}
    case 'play':doPlay(p);break;
    case 'direct':doDirect(p);break;
    case 'jam':doJam(p);break;
    case 'endturn':doEnd(p);break;
    case 'ch':act(()=>{p.play[+d.i].ch=+d.c});break;
    case 'fx':doFx(p,+d.i,d.k);break;
    case 'accel':
      if(p.accel||p.engine<1){toast(t('noheat'));break}
      act(()=>{p.engine--;p.discard.push(mk('h'));p.accel=true;const s=newSlot(null,'⚡');addPlusTo(p,s,1);p.play.push(s);L(p,t('lAccel')+' (−1 Heat)')});break;
    case 'plus':act(()=>{const s=newSlot(null,'✚');addPlusTo(p,s,1);p.play.push(s)});break;
    case 'adrS':act(()=>{p.adrS=!p.adrS});break;
    case 'adrC':act(()=>{p.adrC=!p.adrC});break;
    case 'adj':act(()=>{p.adj=(p.adj||0)+ +d.d});break;
    case 'curve':doCurve(p);break;
    case 'discardsel':{
      const ids=new Set(ui.sel);if(!ids.size){toast(t('nodiscard'));break}
      act(()=>{const out=p.hand.filter(c=>ids.has(c.id));p.hand=p.hand.filter(c=>!ids.has(c.id));p.discard.push(...out);ui.sel.clear()});break;}
    case 'pay':{
      const n=ui.payN;if(p.engine<n){toast(t('noheat'));break}
      act(()=>payHeat(p,n));break;}
    case 'cool':{
      const n=Math.min(ui.coolN,p.hand.filter(c=>c.t==='h').length);
      if(!n){toast(t('noheathand'));break}
      act(()=>{let k=n;p.hand=p.hand.filter(c=>{if(k>0&&c.t==='h'){k--;return false}return true});p.engine+=n;p.coolUsed+=n;L(p,t('lCool',n))});break;}
    case 'advtoggle':ui.adv=!ui.adv;render();break;
    case 'legtoggle':ui.leg=!ui.leg;render();break;
    case 'addcard':{
      let c;
      if(d.k==='u'){const v=await modal({title:t('addUpg'),msg:t('upgMsg'),input:3,ok:t('add')});if(v===null||isNaN(v))break;c=mk('u',v)}
      else c=mk(d.k);
      act(()=>{p.deck.push(c);shuffle(p.deck);L(p,t('lAdd',d.k==='s'?'Stress':d.k==='h'?'Heat':'Upgrade '+c.v))});break;}
    case 'undo':
      if(hist.length){S=JSON.parse(hist.pop());normalize();ui.sel.clear();save();render()}break;
    case 'lang':S.lang=S.lang==='it'?'en':'it';save();render();break;
    case 'setup':ui.screen=(ui.screen==='setup'&&S.started)?'game':'setup';render();break;
    case 'backgame':ui.screen='game';render();break;
    case 'newrace':
      if(!S.players.length)break;
      if(await modal({title:t('newRace'),msg:t('newRaceMsg')}))startRace();break;
    case 'start':startRace();break;
    case 'color':ui.newColor=d.c;render();break;
    case 'add':{
      if(!ui.newColor){toast(t('pickcolor'));break}
      act(()=>{
        const np=newPlayer(ui.newColor,(ui.newName||'').trim()||`${t('pilot')} ${S.players.length+1}`);
        S.players.push(np);if(S.started)buildDeck(np);
        ui.newName='';ui.newColor=null;
      });break;}
    case 'rm':
      if(await modal({title:t('rmConfirm'),msg:''}))act(()=>{S.players=S.players.filter(x=>x.id!==+d.id);if(S.active>=S.players.length)S.active=0;if(!S.players.length)S.started=false});break;
    case 'optstart':S.opts.start=!S.opts.start;S.players.forEach(fixRm);save();render();break;
    case 'step':{
      const k=d.k,[lo,hi]=LIM[k],tgt=d.s==='opts'?S.opts:ui;
      tgt[k]=Math.max(lo,Math.min(hi,tgt[k]+ +d.d));save();render();break;}
    case 'sheet':ui.sheet=d.m==='pool'?{mode:'pool'}:{mode:'pilot',id:+d.id};ui.filt='all';render();break;
    case 'sheetclose':ui.sheet=null;render();break;
    case 'filt':ui.filt=d.f;render();break;
    case 'ptog':{
      const n=+d.n;
      act(()=>{
        if(S.pool.includes(n)){S.pool=S.pool.filter(x=>x!==n);S.players.forEach(q=>{q.upg=q.upg.filter(x=>x!==n);fixRm(q)})}
        else S.pool.push(n);
      });break;}
    case 'utog':{
      const n=+d.n,q=S.players.find(x=>x.id===ui.sheet.id);if(!q)break;
      const ow=owner(n);if(ow&&ow.id!==q.id)break;
      act(()=>{q.upg=q.upg.includes(n)?q.upg.filter(x=>x!==n):[...q.upg,n];fixRm(q)});break;}
    case 'rmtog':{
      const q=S.players.find(x=>x.id===ui.sheet.id);if(!q)break;
      act(()=>{
        if(q.rm.includes(d.k))q.rm=q.rm.filter(x=>x!==d.k);
        else{q.rm.push(d.k);const need=needRm(q);if(q.rm.length>need)q.rm=q.rm.slice(-need)}
      });break;}
  }
});
document.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.in==='limit'){
    ui.limit=e.target.value;
    const el=$('#limeff'),p=S.players[S.active];
    if(el&&p){const f=fx(p),lim=parseInt(ui.limit,10);el.textContent=isNaN(lim)?t('sumLim',sgn(f.lim)):t('limEff',lim,sgn(f.lim),lim+f.lim)}
  }
  else if(d.in==='newname')ui.newName=e.target.value;
  else if(d.in==='pname'){const q=S.players.find(x=>x.id===+d.id);if(q){q.name=e.target.value;save()}}
});
render();
</script>
</body>
