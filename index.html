<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161b">
<meta name="description" content="Unofficial fan-made deck manager. Not affiliated with the game publisher.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heat Deck">
<title>Heat Companion (fan-made)</title>
<style>
:root{--bg:#14161b;--panel:#1d2027;--panel2:#272b34;--txt:#f2f2f2;--mut:#9aa0ab;--acc:#ff5a1f;--pc:#888}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;padding:0 12px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
header{display:flex;align-items:center;gap:6px;padding:12px 0 8px}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.02em}
header h1 span{color:var(--acc)}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel2);font-size:18px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:2px solid transparent;background:var(--panel2);font-weight:600}
.tab.on{border-color:var(--pc);background:var(--panel)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:0 0 auto;display:inline-block}
.tick{color:#7be08a}
.panel{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px}
.panel.me{border-top:5px solid var(--pc)}
.panel h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.pname{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--mut)}
.stat.heat b{color:#ff7a3d}
.flames{margin-top:8px;font-size:16px;letter-spacing:2px;min-height:20px}
.mut{color:var(--mut);font-size:13px}
.gears{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.gear{height:54px;border-radius:14px;border:2px solid var(--panel2);background:var(--panel2);font-size:24px;font-weight:800}
.gear.on{background:var(--pc);border-color:#fff;color:var(--ink,#fff)}
.hand{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;min-height:96px}
.card{width:54px;height:76px;border-radius:9px;border:2px solid rgba(255,255,255,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;color:#fff;padding:0;font-family:inherit;position:relative;transition:transform .1s}
.card .v{font-size:26px;line-height:1}
.card .i{font-size:8px;letter-spacing:.06em;opacity:.9;text-transform:uppercase}
.card.b{background:linear-gradient(160deg,#3b82f6,#1e3a8a)}
.card.s{background:repeating-linear-gradient(45deg,#6d3fc0 0 8px,#4b2a8a 8px 16px)}
.card.h{background:linear-gradient(160deg,#ff7a3d,#b3200f)}
.card.u{background:linear-gradient(160deg,#f6c94a,#a8740c);color:#2a1d00}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px #fff,0 8px 16px #0009}
.card.dis{opacity:.5}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.row.wrap{flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--acc);color:#fff;font-weight:700}
.btn.sec{background:var(--panel2)}
.btn.sec.on{background:#3b82f6}
.btn.big{width:100%;padding:15px;font-size:17px}
.btn.ghost{background:transparent;border:1px solid var(--panel2)}
.btn.sm{padding:8px 12px;font-size:14px}
.play{display:flex;flex-wrap:wrap;gap:10px;min-height:80px;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px}
.slot .arr{font-size:11px;color:var(--mut);line-height:1}
.slot .pl{width:54px;height:30px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800}
.speedbox{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.speedbox span{color:var(--mut);text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.speedbox b{font-size:46px;line-height:1;color:var(--pc);text-shadow:0 0 1px #fff}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border:0;border-radius:10px;background:var(--panel2);font-size:20px}
.step b{min-width:26px;text-align:center;font-size:18px}
input{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid #3a3f4a;border-radius:10px;padding:10px;width:100%;min-width:0}
.lbl{flex:1;font-size:14px}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.x{width:38px;height:38px;border-radius:10px;border:0;background:var(--panel2)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25)}
.sw.on{border-color:#fff;transform:scale(1.12)}
.log{font-size:13px;color:var(--mut);max-height:160px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px solid var(--panel2)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,30px);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center;z-index:50;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
#modal.on{display:flex}
.mbox{background:var(--panel);border-radius:18px;padding:18px;width:100%;max-width:380px}
.mbox h3{margin:0 0 6px}.mbox p{margin:0 0 12px;color:var(--mut)}
.mrow{display:flex;gap:8px;margin-top:12px}.mrow .btn{flex:1}
.disc{margin:18px 4px 4px;font-size:11px;line-height:1.4;color:var(--mut);text-align:center;opacity:.8}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"></div>
<script>
'use strict';
/* ---------- PWA bootstrap (icons + manifest generated at runtime so it stays a single file) ---------- */
(function(){
  try{
    const cv=document.createElement('canvas');
    const icon=sz=>{
      cv.width=cv.height=sz;const x=cv.getContext('2d');
      const g=x.createLinearGradient(0,0,sz,sz);g.addColorStop(0,'#ff7a3d');g.addColorStop(1,'#a81d0e');
      x.fillStyle=g;x.fillRect(0,0,sz,sz);
      const n=8,s=sz/n;
      for(let i=0;i<n;i++){x.fillStyle=i%2?'#fff':'#111';x.fillRect(i*s,0,s,s/2);x.fillStyle=i%2?'#111':'#fff';x.fillRect(i*s,s/2,s,s/2);}
      x.textAlign='center';x.textBaseline='middle';
      x.font=(sz*.36)+'px sans-serif';x.fillText('🔥',sz/2,sz*.42);
      x.fillStyle='#fff';x.font='900 '+(sz*.24)+'px -apple-system,Helvetica,Arial,sans-serif';
      x.shadowColor='#000';x.shadowBlur=sz*.02;x.fillText('HEAT',sz/2,sz*.74);
      return cv.toDataURL('image/png');
    };
    const i180=icon(180),i192=icon(192),i512=icon(512);
    const add=(rel,href,extra)=>{const l=document.createElement('link');l.rel=rel;l.href=href;if(extra)Object.keys(extra).forEach(k=>l.setAttribute(k,extra[k]));document.head.appendChild(l)};
    add('apple-touch-icon',i180,{sizes:'180x180'});
    add('icon',i192,{type:'image/png'});
    const mf={name:'Heat Companion (unofficial fan-made)',short_name:'Heat Deck',start_url:location.href.split('#')[0],scope:location.href.split('#')[0].replace(/[^\/]*$/,''),display:'standalone',orientation:'portrait',background_color:'#14161b',theme_color:'#14161b',icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
    add('manifest',URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'})));
  }catch(e){}
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();

/* ---------- i18n ---------- */
const T={
en:{disc:'Unofficial fan-made tool. Not affiliated with, endorsed or sponsored by the publisher or the authors of "Heat: Pedal to the Metal". All trademarks belong to their respective owners.',setup:'Players & setup',players:'Players',nop:'No cars yet.',addcar:'Add a car',pname:'Pilot name',add:'Add',pilot:'Pilot',opts:'Race setup',heatEngine:'Heat cards in engine',stressN:'Stress cards in deck',startUpg:'Starting upgrade cards (0, 5, +1 Heat)',handLimit:'Hand limit',optNote:'Changes apply when a race is (re)started.',startRace:'Start race',restartRace:'Restart race (rebuild all decks)',back:'Back to game',needPlayer:'Add at least one car first',pickcolor:'No colour available',
deck:'Deck',discard:'Discard',engine:'Engine',hand:'Hand',top:'top',gear:'Gear',gearInfo:'Play {0} card(s) · Cooling {1}',playN:'Play cards ({0}/{1})',selN:'Select exactly {0} cards',jam:'Not enough playable cards for this gear (Heat in hand).',jamBtn:'Full hand: resolve',jamTitle:'Full hand',jamMsg:'Play every playable card, cover the rest with Heat, car does not move, gear → 1, then draw.',
playArea:'Play area',speed:'Speed',accel:'Accelerate (−1 Heat)',plus:'Extra ✚ symbol',adrS:'Adrenaline +1 speed',adrC:'Adrenaline +1 cooling',adj:'Speed adjust (upgrades)',curve:'Curve check',limitPh:'Speed limit',check:'Check',discardSel:'Discard selected',nodiscard:'Select Base/Upgrade cards to discard',endTurn:'End turn · draw to {0}',
payHeat:'Pay Heat · Engine → Discard',coolHeat:'Cool · Hand → Engine',coolLeft:'Cooling allowed this turn: {0}',pay:'Pay',cool:'Cool',tools:'Tools',addStress:'+ Stress',addHeat:'+ Heat',addUpg:'+ Upgrade',addDeck:'Add card to deck (shuffled in)',upgMsg:'Speed value of the Upgrade card:',log:'Log',
undo:'Undo',newRace:'Restart race',lang:'Language',cancel:'Cancel',ok:'OK',rmConfirm:'Remove this car?',newRaceMsg:'Rebuild every deck and start from scratch?',shift2:'Shift 2 gears',shift2msg:'This costs 1 Heat card.',pay1:'Pay 1 Heat',gear2max:'Max 2 gears per turn',noheat:'Not enough Heat in the engine',noheathand:'No Heat cards in hand',nobase:'No Base card left to reveal!',reshuf:'{0}: discard reshuffled into deck',curveok:'Speed {0} ≤ limit {1}: safe',overspeed:'Over the limit!',overmsg:'Speed {0} vs limit {1}: pay {2} Heat.',payN:'Pay {0} Heat',spin:'Spin out!',spinmsg:'Speed {0} vs limit {1}: you need {2} Heat but have {3}. Pay all Heat, take Stress, gear → 1, move car back.',enterlimit:'Enter the speed limit first',
lPlay:'Played gear {0}',lPay:'Paid {0} Heat',lCool:'Cooled {0} Heat',lSpin:'Spun out (+{0} Stress, gear 1)',lEnd:'Turn end · speed {0}',lAccel:'Accelerate',lJam:'Full hand',lAdd:'Added {0} to deck',lShift:'Gear {0} → {1} (−1 Heat)'},
it:{disc:'Strumento non ufficiale creato da un fan. Non affiliato, approvato o sponsorizzato dall\'editore o dagli autori di «Heat: Pedal to the Metal». Tutti i marchi appartengono ai rispettivi proprietari.',setup:'Piloti e setup',players:'Giocatori',nop:'Nessuna auto.',addcar:'Aggiungi un\'auto',pname:'Nome pilota',add:'Aggiungi',pilot:'Pilota',opts:'Setup gara',heatEngine:'Carte Heat nel motore',stressN:'Carte Stress nel mazzo',startUpg:'Migliorie di Partenza (0, 5, +1 Heat)',handLimit:'Limite di mano',optNote:'Le modifiche valgono quando (ri)avvii la gara.',startRace:'Inizia gara',restartRace:'Ricomincia gara (rigenera i mazzi)',back:'Torna al gioco',needPlayer:'Aggiungi prima almeno un\'auto',pickcolor:'Nessun colore disponibile',
deck:'Mazzo',discard:'Scarti',engine:'Motore',hand:'Mano',top:'cima',gear:'Marcia',gearInfo:'Giochi {0} carta/e · Raffreddamento {1}',playN:'Gioca le carte ({0}/{1})',selN:'Seleziona esattamente {0} carte',jam:'Carte giocabili insufficienti per questa marcia (Heat in mano).',jamBtn:'Mano Piena: risolvi',jamTitle:'Mano Piena',jamMsg:'Usi tutte le carte giocabili e copri il resto con Heat, l\'auto non si muove, marcia → 1, poi peschi.',
playArea:'Area di Gioco',speed:'Velocità',accel:'Accelerare (−1 Heat)',plus:'Simbolo ✚ extra',adrS:'Adrenalina +1 Velocità',adrC:'Adrenalina +1 Raffreddamento',adj:'Correzione velocità (Migliorie)',curve:'Controllo curva',limitPh:'Limite di Velocità',check:'Verifica',discardSel:'Scarta selezionate',nodiscard:'Seleziona carte Base/Miglioria da scartare',endTurn:'Fine turno · pesca fino a {0}',
payHeat:'Paga Heat · Motore → Scarti',coolHeat:'Raffredda · Mano → Motore',coolLeft:'Raffreddamento consentito nel turno: {0}',pay:'Paga',cool:'Raffredda',tools:'Strumenti',addStress:'+ Stress',addHeat:'+ Heat',addUpg:'+ Miglioria',addDeck:'Aggiungi carta al mazzo (mescolata)',upgMsg:'Valore di Velocità della Miglioria:',log:'Cronologia',
undo:'Annulla',newRace:'Ricomincia gara',lang:'Lingua',cancel:'Annulla',ok:'OK',rmConfirm:'Rimuovere questa auto?',newRaceMsg:'Rigenerare tutti i mazzi e ripartire da zero?',shift2:'Cambio di 2 marce',shift2msg:'Costa 1 carta Heat.',pay1:'Paga 1 Heat',gear2max:'Massimo 2 marce per turno',noheat:'Heat insufficienti nel motore',noheathand:'Nessuna carta Heat in mano',nobase:'Nessuna carta Base da rivelare!',reshuf:'{0}: scarti rimescolati nel mazzo',curveok:'Velocità {0} ≤ limite {1}: tutto ok',overspeed:'Limite superato!',overmsg:'Velocità {0} contro limite {1}: paga {2} Heat.',payN:'Paga {0} Heat',spin:'Sbandata!',spinmsg:'Velocità {0} contro limite {1}: servono {2} Heat ma ne hai {3}. Paghi tutte le Heat, prendi Stress, marcia → 1, auto indietro.',enterlimit:'Inserisci prima il Limite di Velocità',
lPlay:'Giocata marcia {0}',lPay:'Pagate {0} Heat',lCool:'Raffreddate {0} Heat',lSpin:'Sbandata (+{0} Stress, marcia 1)',lEnd:'Fine turno · velocità {0}',lAccel:'Accelerare',lJam:'Mano Piena',lAdd:'Aggiunta {0} al mazzo',lShift:'Marcia {0} → {1} (−1 Heat)'}
};
const t=(k,...a)=>{let s=(T[S.lang]&&T[S.lang][k])||T.en[k]||k;a.forEach((x,i)=>s=s.split('{'+i+'}').join(x));return s};

/* ---------- constants & state ---------- */
const COLORS=[
 {id:'red',hex:'#e5352b',ink:'#fff',en:'Red',it:'Rosso'},
 {id:'yellow',hex:'#f2c230',ink:'#222',en:'Yellow',it:'Giallo'},
 {id:'blue',hex:'#2f6fdb',ink:'#fff',en:'Blue',it:'Blu'},
 {id:'green',hex:'#2e9e4f',ink:'#fff',en:'Green',it:'Verde'},
 {id:'white',hex:'#f1f1ec',ink:'#222',en:'White',it:'Bianco'},
 {id:'black',hex:'#2a2a2e',ink:'#fff',en:'Black',it:'Nero'},
 {id:'violet',hex:'#8e4fc9',ink:'#fff',en:'Violet',it:'Viola'},
 {id:'grey',hex:'#8a8f98',ink:'#fff',en:'Grey',it:'Grigio'}
];
const KEY='heat-companion-v1';
const DEF=()=>({started:false,players:[],active:0,nextId:1,lang:(navigator.language||'en').toLowerCase().startsWith('it')?'it':'en',opts:{heat:6,stress:3,start:true,hand:7}});
let S=DEF();
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);S=Object.assign(DEF(),o);S.opts=Object.assign(DEF().opts,o.opts||{});}}catch(e){}
const ui={sel:new Set(),screen:null,limit:'',payN:1,coolN:1,adv:false,newName:'',newColor:null};
let hist=[],pending=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const col=p=>COLORS.find(c=>c.id===p.color)||COLORS[0];
const mk=(ty,v=0)=>({id:S.nextId++,t:ty,v});   // t: b=Base, s=Stress, h=Heat, u=Upgrade
const L=(p,m)=>{p.log.unshift(m);if(p.log.length>40)p.log.length=40};
const gearCool=g=>g===1?3:g===2?1:0;
const val=c=>c&&(c.t==='b'||c.t==='u')?c.v:0;
const slotVal=s=>val(s.card)+(s.repl?s.repl.v:0);
const speed=p=>p.play.reduce((a,s)=>a+slotVal(s),0)+(p.adrS?1:0)+(p.adj||0);
const coolAllow=p=>gearCool(p.gear)+(p.adrC?1:0);

/* ---------- deck engine ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// draw one card from top of deck; if deck is empty, shuffle discard pile into a new deck immediately
function drawOne(p){
  if(!p.deck.length){
    if(!p.discard.length)return null;
    p.deck=shuffle(p.discard);p.discard=[];
    pending.push(t('reshuf',p.name));
  }
  return p.deck.pop();
}
function drawTo(p){while(p.hand.length<S.opts.hand){const c=drawOne(p);if(!c)break;p.hand.push(c)}}
// Stress / + symbol rule: reveal until a Base card appears, non-base cards go to discard
function revealBase(p){
  if(![...p.deck,...p.discard].some(c=>c.t==='b'))return null;
  for(let g=0;g<1000;g++){
    const c=drawOne(p);if(!c)return null;
    if(c.t==='b')return c;
    p.discard.push(c);
  }
  return null;
}
function addPlus(p,label){p.play.push({card:null,label,repl:revealBase(p)});if(!p.play[p.play.length-1].repl)pending.push(t('nobase'))}
function payHeat(p,n){p.engine-=n;for(let i=0;i<n;i++)p.discard.push(mk('h'));L(p,t('lPay',n))}
function newPlayer(color,name){return{id:S.nextId++,color,name,deck:[],hand:[],discard:[],play:[],engine:0,gear:1,played:false,adrS:false,adrC:false,adj:0,accel:false,coolUsed:0,log:[]}}
function buildDeck(p){
  const o=S.opts;p.deck=[];p.hand=[];p.discard=[];p.play=[];
  for(let v=1;v<=4;v++)for(let i=0;i<3;i++)p.deck.push(mk('b',v));
  for(let i=0;i<o.stress;i++)p.deck.push(mk('s'));
  if(o.start)p.deck.push(mk('u',0),mk('u',5),mk('h'));
  p.engine=o.heat;p.gear=1;p.played=false;p.adrS=p.adrC=p.accel=false;p.adj=0;p.coolUsed=0;p.log=[];
  shuffle(p.deck);drawTo(p);
}
function resetTurnFlags(p){p.played=false;p.adrS=p.adrC=p.accel=false;p.adj=0;p.coolUsed=0}

/* ---------- UI helpers ---------- */
let toastT;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}
function modal({title,msg='',input=null,ok=t('ok'),cancel=true}){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="mbox"><h3>${esc(title)}</h3><p>${esc(msg)}</p>${input!==null?`<input id="minp" type="number" inputmode="numeric" value="${input}">`:''}<div class="mrow">${cancel?`<button class="btn ghost" id="mc">${t('cancel')}</button>`:''}<button class="btn" id="mo">${esc(ok)}</button></div></div>`;
    m.classList.add('on');
    const close=v=>{m.classList.remove('on');m.innerHTML='';res(v)};
    $('#mo').onclick=()=>close(input!==null?parseInt($('#minp').value,10):true);
    if(cancel)$('#mc').onclick=()=>close(input!==null?null:false);
  });
}
function act(fn){
  hist.push(JSON.stringify(S));if(hist.length>40)hist.shift();
  pending=[];fn();save();render();
  if(pending.length)toast([...new Set(pending)].join(' · '));
}
const stepper=(scope,k,val)=>`<div class="step"><button data-a="step" data-s="${scope}" data-k="${k}" data-d="-1">−</button><b>${val}</b><button data-a="step" data-s="${scope}" data-k="${k}" data-d="1">+</button></div>`;
const LIM={heat:[0,10],stress:[0,8],hand:[4,10],payN:[1,10],coolN:[1,10]};

/* ---------- rendering ---------- */
const RANK={b:0,u:1,s:2,h:3};
function cardHTML(c,o={}){
  const tag=o.act?'button':'div';
  let inner='';
  if(c.t==='b')inner=`<span class="v">${c.v}</span><span class="i">Base</span>`;
  else if(c.t==='s')inner=`<span class="v">✚</span><span class="i">Stress</span>`;
  else if(c.t==='h')inner=`<span class="v">🔥</span><span class="i">Heat</span>`;
  else inner=`<span class="v">${c.v}</span><span class="i">⬆ Upg</span>`;
  return `<${tag} class="card ${c.t}${o.sel?' sel':''}${o.dis?' dis':''}" ${o.act?`data-a="sel" data-id="${c.id}"${o.dis?' disabled':''}`:''}>${inner}</${tag}>`;
}
const slotHTML=s=>`<div class="slot">${s.card?cardHTML(s.card):`<div class="pl">${esc(s.label)}</div>`}${s.repl?`<div class="arr">▼</div>${cardHTML(s.repl)}`:(s.card&&s.card.t==='s'?'<div class="arr">∅</div>':'')}</div>`;
const selectable=(p,c)=>p.played?(c.t==='b'||c.t==='u'):c.t!=='h';
function header(setup){
  return `<header><h1>🏁 Heat <span>Companion</span> <small style="font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.04em">fan-made</small></h1>
  <button class="ib" data-a="undo" aria-label="${t('undo')}" ${hist.length?'':'disabled'}>↶</button>
  <button class="ib" data-a="setup" aria-label="${t('setup')}">${setup&&S.started?'🏎':'👥'}</button>
  <button class="ib" data-a="lang" aria-label="${t('lang')}" style="font-size:13px;font-weight:700">${S.lang.toUpperCase()}</button>
  ${S.started?`<button class="ib" data-a="newrace" aria-label="${t('newRace')}">⟳</button>`:''}</header>`;
}
function renderSetup(){
  const taken=new Set(S.players.map(p=>p.color));
  const free=COLORS.filter(c=>!taken.has(c.id));
  if(!ui.newColor||taken.has(ui.newColor))ui.newColor=free[0]?free[0].id:null;
  const o=S.opts;
  return `<section class="panel"><h2>${t('players')}</h2>
   ${S.players.map(p=>`<div class="prow"><span class="dot" style="background:${col(p).hex}"></span><input data-in="pname" data-id="${p.id}" value="${esc(p.name)}" maxlength="20"><button class="x" data-a="rm" data-id="${p.id}">✕</button></div>`).join('')||`<p class="mut">${t('nop')}</p>`}
  </section>
  <section class="panel"><h2>${t('addcar')}</h2>
   <div class="swatches">${free.map(c=>`<button class="sw ${ui.newColor===c.id?'on':''}" style="background:${c.hex}" data-a="color" data-c="${c.id}" aria-label="${c[S.lang]}"></button>`).join('')}</div>
   <div class="prow"><input data-in="newname" placeholder="${t('pname')}" value="${esc(ui.newName)}" maxlength="20"><button class="btn" data-a="add" ${free.length?'':'disabled'}>${t('add')}</button></div>
  </section>
  <section class="panel"><h2>${t('opts')}</h2>
   <div class="prow"><span class="lbl">${t('heatEngine')}</span>${stepper('opts','heat',o.heat)}</div>
   <div class="prow"><span class="lbl">${t('stressN')}</span>${stepper('opts','stress',o.stress)}</div>
   <div class="prow"><span class="lbl">${t('handLimit')}</span>${stepper('opts','hand',o.hand)}</div>
   <div class="prow"><span class="lbl">${t('startUpg')}</span><button class="btn sec sm ${o.start?'on':''}" data-a="optstart">${o.start?'ON':'OFF'}</button></div>
   <p class="mut">${t('optNote')}</p>
  </section>
  ${S.started&&S.players.length?`<button class="btn big" data-a="backgame">${t('back')}</button><div style="height:10px"></div><button class="btn sec big" data-a="newrace">${t('restartRace')}</button>`:`<button class="btn big" data-a="start">${t('startRace')}</button>`}`;
}
function renderGame(){
  if(S.active>=S.players.length)S.active=0;
  const p=S.players[S.active],c=col(p);
  const top=p.discard.length?p.discard[p.discard.length-1]:null;
  const topTxt=top?(top.t==='b'||top.t==='u'?top.v:top.t==='s'?'✚':'🔥'):'–';
  const hand=[...p.hand].sort((a,b)=>RANK[a.t]-RANK[b.t]||a.v-b.v);
  ui.sel.forEach(id=>{if(!p.hand.some(x=>x.id===id))ui.sel.delete(id)});
  const playable=p.hand.filter(x=>x.t!=='h').length;
  const nSel=ui.sel.size;
  let h=`<div class="tabs">${S.players.map((q,i)=>`<button class="tab ${i===S.active?'on':''}" style="--pc:${col(q).hex}" data-a="tab" data-i="${i}"><span class="dot" style="background:${col(q).hex}"></span>${esc(q.name)}${q.played?' <span class="tick">●</span>':''}</button>`).join('')}</div>`;
  h+=`<section class="panel me" style="--pc:${c.hex};--ink:${c.ink}">
    <div class="pname"><span class="dot" style="background:${c.hex}"></span>${esc(p.name)}</div>
    <div class="stats">
     <div class="stat"><b>${p.deck.length}</b><span>${t('deck')}</span></div>
     <div class="stat"><b>${p.discard.length}</b><span>${t('discard')} · ${t('top')} ${topTxt}</span></div>
     <div class="stat heat"><b>${p.engine}</b><span>🔥 ${t('engine')}</span></div>
     <div class="stat"><b>${p.hand.length}/${S.opts.hand}</b><span>${t('hand')}</span></div>
    </div>
    <div class="flames">${'🔥'.repeat(Math.min(p.engine,14))}</div>
  </section>`;
  if(!p.played){
    h+=`<section class="panel" style="--pc:${c.hex};--ink:${c.ink}"><h2>${t('gear')}</h2>
      <div class="gears">${[1,2,3,4].map(g=>`<button class="gear ${p.gear===g?'on':''}" data-a="gear" data-g="${g}">${g}</button>`).join('')}</div>
      <div class="mut">${t('gearInfo',p.gear,gearCool(p.gear))}</div></section>`;
  }else{
    const allow=coolAllow(p)-p.coolUsed;
    h+=`<section class="panel" style="--pc:${c.hex}"><h2>${t('playArea')}</h2>
      <div class="play">${p.play.map(slotHTML).join('')}</div>
      <div class="speedbox"><span>${t('speed')}</span><b>${speed(p)}</b></div>
      <div class="row wrap">
        <button class="btn sec" data-a="accel" ${p.accel?'disabled':''}>⚡ ${t('accel')}</button>
        <button class="btn sec" data-a="plus">${t('plus')}</button>
      </div>
      <div class="row wrap">
        <button class="btn sec sm ${p.adrS?'on':''}" data-a="adrS">${t('adrS')}</button>
        <button class="btn sec sm ${p.adrC?'on':''}" data-a="adrC">${t('adrC')}</button>
      </div>
      <div class="prow" style="margin-top:10px"><span class="lbl">${t('adj')}</span><div class="step"><button data-a="adj" data-d="-1">−</button><b>${p.adj>0?'+':''}${p.adj}</b><button data-a="adj" data-d="1">+</button></div></div>
      <h2 style="margin-top:14px">${t('curve')}</h2>
      <div class="prow"><input data-in="limit" type="number" inputmode="numeric" placeholder="${t('limitPh')}" value="${esc(ui.limit)}"><button class="btn" data-a="curve">${t('check')}</button></div>
      <p class="mut" style="margin:0">${t('coolLeft',Math.max(0,allow))}</p>
    </section>`;
  }
  h+=`<section class="panel"><h2>${t('hand')}</h2>
    <div class="hand">${hand.map(x=>cardHTML(x,{act:1,sel:ui.sel.has(x.id),dis:!selectable(p,x)})).join('')}</div>`;
  if(!p.played){
    h+=`<div class="row"><button class="btn big" data-a="play" ${nSel===p.gear?'':'disabled'}>▶ ${t('playN',nSel,p.gear)}</button></div>`;
    if(playable<p.gear)h+=`<p class="mut">${t('jam')}</p><button class="btn sec big" data-a="jam">${t('jamBtn')}</button>`;
  }else{
    h+=`<div class="row wrap"><button class="btn sec" data-a="discardsel" ${nSel?'':'disabled'}>🗑 ${t('discardSel')} (${nSel})</button></div>
        <div class="row"><button class="btn big" data-a="endturn">✔ ${t('endTurn',S.opts.hand)}</button></div>`;
  }
  h+=`</section>`;
  h+=`<section class="panel"><h2>🔥 Heat</h2>
    <div class="prow"><span class="lbl">${t('payHeat')}</span>${stepper('ui','payN',ui.payN)}<button class="btn sm" data-a="pay">${t('pay')}</button></div>
    <div class="prow"><span class="lbl">${t('coolHeat')}</span>${stepper('ui','coolN',ui.coolN)}<button class="btn sm" data-a="cool">${t('cool')}</button></div>
  </section>`;
  h+=`<section class="panel"><h2 data-a="advtoggle" style="cursor:pointer">${ui.adv?'▾':'▸'} ${t('tools')}</h2>${ui.adv?`
    <p class="mut" style="margin:0 0 8px">${t('addDeck')}</p>
    <div class="row wrap" style="margin-top:0"><button class="btn sec" data-a="addcard" data-k="s">${t('addStress')}</button><button class="btn sec" data-a="addcard" data-k="h">${t('addHeat')}</button><button class="btn sec" data-a="addcard" data-k="u">${t('addUpg')}</button></div>
    <h2 style="margin-top:16px">${t('log')}</h2><div class="log">${p.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:''}</section>`;
  return h;
}
function render(){
  document.documentElement.lang=S.lang;
  const setup=ui.screen==='setup'||!S.started||!S.players.length;
  const p=S.players[S.active];
  document.body.style.setProperty('--pc',p?col(p).hex:'#888');
  $('#app').innerHTML=header(setup)+(setup?renderSetup():renderGame())+`<footer class="disc">${t('disc')}</footer>`;
}

/* ---------- actions ---------- */
async function setGear(p,g){
  if(p.played||g===p.gear)return;
  const d=Math.abs(g-p.gear);
  if(d>2){toast(t('gear2max'));return}
  if(d===2){
    if(p.engine<1){toast(t('noheat'));return}
    if(!await modal({title:t('shift2'),msg:t('shift2msg'),ok:t('pay1')}))return;
    act(()=>{const old=p.gear;p.engine--;p.discard.push(mk('h'));p.gear=g;L(p,t('lShift',old,g))});
    return;
  }
  act(()=>{p.gear=g});
}
function doPlay(p){
  const cards=[...ui.sel].map(id=>p.hand.find(c=>c.id===id)).filter(Boolean);
  if(cards.length!==p.gear){toast(t('selN',p.gear));return}
  act(()=>{
    const ids=new Set(cards.map(c=>c.id));
    p.hand=p.hand.filter(c=>!ids.has(c.id));
    p.play=cards.map(c=>({card:c,repl:null,label:''}));
    p.play.forEach(s=>{if(s.card.t==='s'){s.repl=revealBase(p);if(!s.repl)pending.push(t('nobase'))}});
    p.played=true;p.coolUsed=0;ui.sel.clear();
    L(p,t('lPlay',p.gear));
  });
}
async function doJam(p){
  if(!await modal({title:t('jamTitle'),msg:t('jamMsg'),ok:t('ok')}))return;
  act(()=>{
    const playable=p.hand.filter(c=>c.t!=='h');
    const need=Math.max(0,p.gear-playable.length);
    const heats=p.hand.filter(c=>c.t==='h').slice(0,need);
    const ids=new Set([...playable,...heats].map(c=>c.id));
    p.hand=p.hand.filter(c=>!ids.has(c.id));
    p.discard.push(...playable,...heats);
    p.gear=1;L(p,t('lJam'));drawTo(p);ui.sel.clear();
  });
}
function doEnd(p){
  act(()=>{
    const sp=speed(p);
    p.play.forEach(s=>{if(s.card)p.discard.push(s.card);if(s.repl)p.discard.push(s.repl)});
    p.play=[];resetTurnFlags(p);ui.sel.clear();ui.limit='';
    drawTo(p);L(p,t('lEnd',sp));
  });
}
async function doCurve(p){
  const lim=parseInt(ui.limit,10);
  if(isNaN(lim)){toast(t('enterlimit'));return}
  const sp=speed(p),ex=sp-lim;
  if(ex<=0){toast(t('curveok',sp,lim));return}
  if(p.engine>=ex){
    if(await modal({title:t('overspeed'),msg:t('overmsg',sp,lim,ex),ok:t('payN',ex)}))act(()=>payHeat(p,ex));
  }else if(await modal({title:t('spin'),msg:t('spinmsg',sp,lim,ex,p.engine),ok:t('spin')})){
    act(()=>{
      if(p.engine>0)payHeat(p,p.engine);
      const n=p.gear<=2?1:2;
      for(let i=0;i<n;i++)p.hand.push(mk('s'));
      p.gear=1;L(p,t('lSpin',n));
    });
  }
}
function startRace(){
  if(!S.players.length){toast(t('needPlayer'));return}
  act(()=>{S.players.forEach(buildDeck);S.started=true;S.active=0;ui.screen='game';ui.sel.clear()});
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const d=el.dataset,p=S.players[S.active];
  switch(d.a){
    case 'tab':S.active=+d.i;ui.sel.clear();ui.limit='';save();render();break;
    case 'gear':setGear(p,+d.g);break;
    case 'sel':{
      const c=p.hand.find(x=>x.id===+d.id);if(!c||!selectable(p,c))break;
      ui.sel.has(c.id)?ui.sel.delete(c.id):ui.sel.add(c.id);render();break;}
    case 'play':doPlay(p);break;
    case 'jam':doJam(p);break;
    case 'endturn':doEnd(p);break;
    case 'accel':
      if(p.accel||p.engine<1){toast(t('noheat'));break}
      act(()=>{p.engine--;p.discard.push(mk('h'));p.accel=true;addPlus(p,'⚡');L(p,t('lAccel')+' (−1 Heat)')});break;
    case 'plus':act(()=>addPlus(p,'✚'));break;
    case 'adrS':act(()=>{p.adrS=!p.adrS});break;
    case 'adrC':act(()=>{p.adrC=!p.adrC});break;
    case 'adj':act(()=>{p.adj=(p.adj||0)+ +d.d});break;
    case 'curve':doCurve(p);break;
    case 'discardsel':{
      const ids=new Set(ui.sel);if(!ids.size){toast(t('nodiscard'));break}
      act(()=>{const out=p.hand.filter(c=>ids.has(c.id));p.hand=p.hand.filter(c=>!ids.has(c.id));p.discard.push(...out);ui.sel.clear()});break;}
    case 'pay':{
      const n=ui.payN;if(p.engine<n){toast(t('noheat'));break}
      act(()=>payHeat(p,n));break;}
    case 'cool':{
      const n=Math.min(ui.coolN,p.hand.filter(c=>c.t==='h').length);
      if(!n){toast(t('noheathand'));break}
      act(()=>{let k=n;p.hand=p.hand.filter(c=>{if(k>0&&c.t==='h'){k--;return false}return true});p.engine+=n;p.coolUsed+=n;L(p,t('lCool',n))});break;}
    case 'advtoggle':ui.adv=!ui.adv;render();break;
    case 'addcard':{
      let c;
      if(d.k==='u'){const v=await modal({title:t('addUpg'),msg:t('upgMsg'),input:3,ok:t('add')});if(v===null||isNaN(v))break;c=mk('u',v)}
      else c=mk(d.k);
      act(()=>{p.deck.push(c);shuffle(p.deck);L(p,t('lAdd',d.k==='s'?'Stress':d.k==='h'?'Heat':'Upgrade '+c.v))});break;}
    case 'undo':
      if(hist.length){S=JSON.parse(hist.pop());ui.sel.clear();save();render()}break;
    case 'lang':S.lang=S.lang==='it'?'en':'it';save();render();break;
    case 'setup':ui.screen=(ui.screen==='setup'&&S.started)?'game':'setup';render();break;
    case 'backgame':ui.screen='game';render();break;
    case 'newrace':
      if(!S.players.length)break;
      if(await modal({title:t('newRace'),msg:t('newRaceMsg')}))startRace();break;
    case 'start':startRace();break;
    case 'color':ui.newColor=d.c;render();break;
    case 'add':{
      if(!ui.newColor){toast(t('pickcolor'));break}
      act(()=>{
        const np=newPlayer(ui.newColor,(ui.newName||'').trim()||`${t('pilot')} ${S.players.length+1}`);
        S.players.push(np);if(S.started)buildDeck(np);
        ui.newName='';ui.newColor=null;
      });break;}
    case 'rm':
      if(await modal({title:t('rmConfirm'),msg:''}))act(()=>{S.players=S.players.filter(x=>x.id!==+d.id);if(S.active>=S.players.length)S.active=0;if(!S.players.length)S.started=false});break;
    case 'optstart':S.opts.start=!S.opts.start;save();render();break;
    case 'step':{
      const k=d.k,[lo,hi]=LIM[k],tgt=d.s==='opts'?S.opts:ui;
      tgt[k]=Math.max(lo,Math.min(hi,tgt[k]+ +d.d));save();render();break;}
  }
});
document.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.in==='limit')ui.limit=e.target.value;
  else if(d.in==='newname')ui.newName=e.target.value;
  else if(d.in==='pname'){const q=S.players.find(x=>x.id===+d.id);if(q){q.name=e.target.value;save()}}
});
render();
</script>
</body>
</html>
